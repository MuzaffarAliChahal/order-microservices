apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: orders-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: YOUR_REGISTRY/api-gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ORDER_SERVICE_URL, value: "http://order-service:8081" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:8083" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: orders-demo }
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
