apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-service, namespace: orders-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata: { labels: { app: payment-service } }
    spec:
      containers:
        - name: payment-service
          image: YOUR_REGISTRY/payment-service:1.0.0
          ports: [{ containerPort: 8082 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: PAYMENT_LIMIT, value: "1000.00" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: payment-service, namespace: orders-demo }
spec:
  type: ClusterIP
  selector: { app: payment-service }
  ports: [{ port: 8082, targetPort: 8082 }]
