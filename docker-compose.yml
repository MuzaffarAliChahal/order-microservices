x-service: &service
  restart: on-failure
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-service:
    <<: *service
    build: { context: ., args: { MODULE: order-service } }
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
    ports: ["8081:8081"]

  payment-service:
    <<: *service
    build: { context: ., args: { MODULE: payment-service } }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PAYMENT_LIMIT: "1000.00"
    ports: ["8082:8082"]

  notification-service:
    <<: *service
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8083:8083"]

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    restart: on-failure
    depends_on: [order-service, notification-service]
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
    ports: ["8080:8080"]
